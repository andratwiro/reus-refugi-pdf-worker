name: Optimize Airtable PDFs

# Comprimeix els PDFs grans pujats a la taula Documents d'Airtable.
#
# TRIGGER: normalment automàtic — l'endpoint /optimize/dispatch del Worker
# el dispara quan una Airtable Automation detecta un fitxer nou a Documents.
# Si el dispatch porta un `record`, optimitza NOMÉS aquell record (triga
# segons); si no, optimitza tota la taula. També es pot llançar a mà:
#   - Actions → "Optimize Airtable PDFs" → "Run workflow" (camp record opcional)
#   - gh CLI:  gh workflow run optimize-pdfs.yml -f record=recXXXXXXXXXXXXXX
#
# COST: $0. Repos públics tenen Actions gratuïts sense límit.
#
# REQUISITS: secret `AIRTABLE_TOKEN` configurat al repo (Settings → Secrets
# → Actions → New). Token amb scopes data.records:read + data.records:write
# + schema.bases:read, restringit a la base Venus.

on:
  workflow_dispatch:
    inputs:
      record:
        description: "Documents record id (recXXX) a optimitzar. Buit = tota la taula."
        required: false
        default: ""

# Concurrency per record: runs de records diferents corren en paral·lel
# (cap thrashing en bursts d'uploads); dos runs del MATEIX record s'encuen
# (l'script és idempotent, el segon no troba res a fer). Els runs de tota
# la taula comparteixen el grup "all".
concurrency:
  group: optimize-pdfs-${{ github.event.inputs.record || 'all' }}
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install ghostscript + imagemagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ghostscript imagemagick
          # Ubuntu's ImageMagick policy.xml bloqueja PDF per CVE-2018-16323.
          # El nostre cas d'ús és intern + token-protected, així que el
          # desbloquegem per a aquest runner. NO posis aquesta config a un
          # servidor public.
          sudo sed -i 's|<policy domain="coder" rights="none" pattern="PDF" />|<policy domain="coder" rights="read\|write" pattern="PDF" />|' /etc/ImageMagick-6/policy.xml || true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run optimization
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          OPT_RECORD: ${{ github.event.inputs.record }}
        run: |
          if [ -n "$OPT_RECORD" ]; then
            echo "Optimitzant només el record $OPT_RECORD"
            npx tsx scripts/optimize-airtable-pdfs.ts --apply --record="$OPT_RECORD"
          else
            echo "Optimitzant tota la taula Documents"
            npx tsx scripts/optimize-airtable-pdfs.ts --apply
          fi
